[book]
authors = ["Gabor Szabo"]
language = "en"
src = "src"
title = "SVG - Scalable Vector Graphics"

# Add github icon to the menu
[output.html]
git-repository-url = "https://github.com/szabgab/svg.code-maven.com"
git-repository-icon = "fas-code-fork"
edit-url-template = "https://github.com/szabgab/svg.code-maven.com/edit/main/books/svg/{path}"
additional-js = ["custom.js", "addlinks.js"]

[output.markdown]

# Handle Youtube video embedding and the footer
[preprocessor.embedify]
footer.enable = true
footer.message = "Copyright © 2026 • Created with ❤️  by [Gábor Szabó](https://szabgab.com/)"




